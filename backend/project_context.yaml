    snippet_highlight: "arc-snippet em { color: amber } in search/page.tsx — hnt uses hnt-snippet em { color: green }"
    timestamp_sort: |
      Huntaegis articles use epoch ms timestamps (not ISO strings like arc-codex).
      get_stats() in huntaegis main.py must use ts_key() for sorting:
        def ts_key(t):
            return int(t) if t.isdigit() else int(datetime.fromisoformat(...).timestamp()*1000)

  docker_notes:
    status: "✅ RESOLVED — Docker frontend fully operational"
    docker_ce: "29.3.0 installed on Z230"
    musl_swc_fix: |
      CRITICAL for new stacks: package-lock.json generated on glibc host won't include
      @next/swc-linux-x64-musl needed inside Alpine container. Fix in Dockerfile.frontend:
        RUN npm ci --legacy-peer-deps && npm install @next/swc-linux-x64-musl \
            --legacy-peer-deps --ignore-scripts 2>/dev/null || true
      provision.sh v1.1 applies this patch automatically.
    network_mode: "frontend uses network_mode: host"
    fix: "ENV HOSTNAME='' in Dockerfile.frontend runner stage"
    health_check: "Uses wget -qO- (not curl — Alpine has no curl)"

