    alerts: "Scans last 2min of all logs every 60s"
    dedup: "1 alert per issue per hour via Redis TTL"
    digest: "Daily 7am — top 10 articles by chimera_score"
    startup_email: "Sends 'Mailer Started' on startup — harmless noise, can suppress"
    pipeline_stall: "Alerts if no new articles in 2 hours"
    send_email_signature: "send_email(subject: str, body_text: str, body_html: str = None) -> bool"

