    v5.2: "Feb 27, 2026: Google SSO, Auth.js v5, user_prefs blueprint"
    v5.1: "Feb 27, 2026: Translation 67 langs + RTL, Redis cache"
    v5.0: "Feb 27, 2026: itc_stack->arc_stack, Solr orphan purge, kasmir7 v7"
    v4.1: "Feb 26, 2026: Email infra, search v2.0, publish v5.0"
    v4.0: "Feb 25, 2026: Arc Codex rebrand, ollama_utils extracted"
    v3.5: "Feb 18, 2026: Solr search, zero-dependency markdown"
