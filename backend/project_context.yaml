                ├── developer/page.tsx     # v6.1 — ARIA pass
                ├── contact/page.tsx
                ├── privacy/page.tsx
                └── terms/page.tsx

  api_endpoints:
    "GET /api/articles":           "paginated feed — ?limit=N&offset=N"
    "GET /api/articles/<id>":      "single article with full analysis"
    "POST /api/submit":            "submit URL/text/file for processing"
    "GET /api/search":             "Solr full-text — ?q=query&limit=N&sort=[recent|relevant|score_desc|score_asc]"
    "GET /api/stats":              "article_count, oldest, newest — polled every 30s by search page"
    "GET /api/translate/<id>":     "translate article — ?lang=<language name>"
    "DELETE /api/translate/<id>/cache": "admin cache bust"
    "GET /api/user/prefs":         "fetch prefs (via Next.js proxy)"
    "POST /api/user/prefs":        "upsert on login (loopback only)"
    "PATCH /api/user/prefs":       "update preferred_lang"
    "DELETE /api/user/prefs":      "GDPR deletion"
    "GET /api/rss":                "RSS 2.0 with full analysis — Arc Codex branded"
    "GET /api/feed.xml":           "alias for /api/rss"
    "POST /api/upload_image":      "upload cover image — auto-resized to 1200x630 JPEG via Pillow"
    "POST /api/post_bluesky":      "manual Bluesky post for article (account poster)"

  blueprint_registry: |
    app.register_blueprint(rss_blueprint)
    from translation import translation_bp; app.register_blueprint(translation_bp)
    from user_prefs import user_prefs_bp;   app.register_blueprint(user_prefs_bp)

  redis_schemas:
    article:      "article:{id} hash — id, title, url, source, original_text, timestamp, directive, category, source_lang, chimera_score, red/blue/purple_team_analysis, sentinel_verdict, og_image, slug, imageUrl, origin, visibility, owner"
    comment:      "comments:{article_id} list of JSON"
    reaction:     "reactions:{comment_id} hash — like, dislike, heart, happy, sad, angry"
    translation:  "translation:{article_id}:{lang} JSON TTL 24h — {title, original_text, rtl} (local) or 5-field (pro)"
    user_sso:     "user:{google_sub} hash — email, name, picture, preferred_lang, created_at, last_seen"
    stream:       "analysis:pending Redis Stream / consumer group: analysis_workers"
    trans_lock:   "translation:active TTL 300s — held while TranslateGemma running"
    mailer_dedup: "mailer:alerted:{key} TTL 14400s (4h)"
    mailer_digest: "mailer:digest:{YYYY-MM-DD} TTL 90000s"
    last_publish: "arc:last_publish — ISO UTC timestamp set by scribe on every publish"
    autopost:     "bluesky:autopost, mastodon:autopost, linkedin:autopost — 1|0"
    posted_sets:  "bluesky:posted, mastodon:posted, linkedin:posted — SET of article IDs"

  auth_notes:
    library: "next-auth@5.0.0-beta.30"
    strategy: JWT (no Redis adapter)
    trustHost: "REQUIRED in auth.ts"
    google_sub: "account.providerAccountId (NOT user.id)"
    x_user_id: "Set ONLY in app/api/user/prefs/route.ts — never in browser code"
    loopback_guard: "user_prefs.py 403 if remote_addr != 127.0.0.1"
    backend_internal_url: "BOTH route.ts and auth.ts use BACKEND_INTERNAL_URL=http://localhost:5005 for all server-side Flask calls. NEXT_PUBLIC_ is browser only. NEVER use NEXT_PUBLIC_BACKEND_URL for server-side — it routes through Caddy/WAN and the loopback guard in user_prefs.py will 403 it."

  ai_notes:
    ollama_return: "call_ollama_with_fallback() returns TUPLE (text, duration_ms, model). Use result[0] for text."
    ollama_fallback_chain: "devstral-2:123b-cloud → mistral:7b → llama3.2:latest. Configure via OLLAMA_LOCAL_FALLBACK and OLLAMA_LOCAL_FALLBACK2 in .env."
    sentinel_resilience: |
      _repair_sentinel_json() tries 5 recovery strategies.
      Final fallback: if model returned prose (no JSON braces), returns UNCERTAIN with summary note.
      run_sentinel_analysis(): missing required keys filled with defaults, not None.
      Net: Sentinel never silently fails — always produces a result.
    translation_danger: "NEVER auto-translate on feed mount — 33 cards x Ollama = gunicorn starvation. Click-only."
    translation_model: "TranslateGemma:4b needs /api/chat (NOT /api/generate), ISO 639-1 codes, system preamble, temp 0.2"
    translation_lock: "translation.py sets Redis translation:active. ollama_utils waits up to 60s before analysis calls."
    translation_fields: "Local = [title, original_text] only. Pro (devstral) = all 5 fields."
    counter_analyst_author: "Must be exactly 'A.R.C. Counter-Analyst' — frontend styling depends on exact string"
    sentinel_fatal: false
    counter_analyst_fatal: false
    stream_delivery: "Redis Streams only — no filesystem JSON writes"
    chimera_score_caveat: "Calibrated on English. Non-English articles may score abnormally."

  image_upload_notes: |
    /api/upload_image (main.py) auto-resizes all uploads via Pillow:
    - img.thumbnail((1200, 630)) — preserves aspect ratio, fits within social card dimensions
    - Converts all formats to JPEG, quality=85
    - Content hash computed on RESIZED bytes (dedup still works)
    - Reason: iPhone photos (4032x3024, 3.7MB) were silently dropped by Bluesky card crawler
    - Result: og:image renders correctly on Bluesky, Mastodon, and other crawlers

  directives_notes: |
    directives.json v2.0 (Mar 22, 2026):
    - 928 lines, 10 topic groups, ~300+ keywords total
    - New topics: World Affairs (priority 97), Healthcare (priority 87)
    - All existing topics massively expanded with real headline keywords
    - General News priority bumped 1→50 as true catch-all
    - Removed: "survivors" from Epstein directive (too generic — matched unrelated articles)
    - Added dance/ballet/choreograph/performance/theater keywords to General News
    - Key fix: named entities (Trump, OpenAI, Anthropic, Claude, DOGE, CDC etc.) now in keywords

  intelligencecard_notes: |
    IntelligenceCard.tsx v7.0 (Mar 22, 2026):
    Header button row: [Permalink] [Copy] [ResearchMenu] [ShareMenu]

    ResearchMenu (magnifying glass icon):
    - Google: google.com/search?q={title}
    - Claude: claude.ai/new?q={title}
    - ChatGPT: chatgpt.com/?q={title}
    - Perplexity: perplexity.ai/?q={title}
    Note: Gemini dropped — does not support URL query prefilling natively.

    ShareMenu (share icon):
    - Bluesky: bsky.app/intent/compose?text={sharePayload} (reader's account)
    - Mastodon: mastodon.social/share?text={sharePayload} (reader's account)
    - Facebook: facebook.com/sharer.php?u={url}
    - Substack: clipboard copy + open substack.com/publish/post/new
    - Email: mailto: with title + payload
    Note: X/LinkedIn removed Mar 22. All labels one word for clean UI.

  mastodon_notes:
    instance: mastodon.social
    handle: "@rossnesbitt@mastodon.social"
    app: "Arc Codex — app ID 8424769"
    scope: "write:statuses (write:media needed for image upload — token needs updating)"
    file: backend/mastodon_poster.py
    on_off: "redis-cli -a simplenes set mastodon:autopost 1|0"
    posted_set: "mastodon:posted — SET of article IDs (prevents duplicates)"
    seed_on_start: "All existing articles seeded on startup — no spam flood"
    image_note: "Media upload 403 on current token (missing write:media scope). Posts still go out without image via link preview."
    post_format: |
      {title}

      {counter-analyst comment or purple excerpt}

      {article URL}

  security_notes:
    redis_bind: "127.0.0.1 only — fixed Mar 7 2026 (was 0.0.0.0)"
    disabled_services: [zabbix-server, zabbix-agent, mariadb, snmpd, unbound, huntaegis-stack, neetwatch-stack]
    reason: "Zabbix+MariaDB redundant with Netdata; SNMP/Unbound not needed; huntaegis/neetwatch disabled pending priority queue namespace fix"

  frontend_gotchas:
    feedclient: "NEVER restructure — surgical deletions only. Directive filter: useSearchParams reads ?directive=X, resets feed on change, passes to /api/get_feed. isFirstRender ref prevents wipe on mount."
    layouttheme: "Check LayoutTheme.module.css first for any color issues"
    user_prefs_import: "From @/components/UserPrefsContext — NOT @/hooks/useUserPrefs"
