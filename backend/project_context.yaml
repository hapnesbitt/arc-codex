  nlp_instrumentation: |
    pre_analyze v3.0 (main.py) — full NLP extraction per article:
    - VADER: compound + pos/neg/neu breakdown
    - TextBlob: subjectivity → objectivity → chimera_score
    - textstat: FK grade, Coleman-Liau, SMOG, Dale-Chall, word count, sentence count, syllable count
