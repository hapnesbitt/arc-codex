# Arc Codex Project Context
# VERSION 7.16 - Updated Mar 20, 2026
# Restructured into three audience sections: USER / ADMIN / DEVELOPER
# Comprehensive reference for AI assistants working on this codebase
#
# QUICK NAVIGATION:
#   USER      — What Arc Codex does for readers (line ~20)
#   ADMIN     — Running and operating the stack (line ~110)
#   DEVELOPER — Technical spec, API, schemas, AI notes, TODO (line ~330)

# ==============================================================================
# SECTION 1: USER
# ==============================================================================

user:
  product: Arc Codex
  tagline: Intelligence infrastructure for the independent mind
  domain: arc-codex.com
  mission: >
    Arc Codex transforms raw information into structured intelligence using the
    A.R.C. (Argumentative Resilience Codex) framework. It does not give you
    conclusions — it gives you tools to think better. No ads, no tracking,
    no paywalls. Deployable counter-intelligence for emergent social threats.

  vision: >
    "Conjecture and Critique" — epistemic infrastructure for everyone, not just
    people who can read a paper on RLHF. The manipulation patterns A.R.C. detects
    are already operating at planetary scale on billions of people. The inoculation
    needs to scale the same way. Arc Codex is the Snow Crash Librarian: a site
    that spins up, ingests everything on one topic, runs it through the A.R.C.
    framework, and hands you back a living document that updates itself.

  arc_framework:
    description: Every article is analyzed by three independent AI teams
    red_team: Extracts verifiable facts only. Who, what, when, where. No interpretation.
    blue_team: Balanced executive summary for educated readers. Journalistic neutrality.
    purple_team: |
      Watchline Operator — deep cognitive analysis:
      1. Steelman the narrative
      2. Scan for 48 A.R.C. anti-patterns
      3. Root cause analysis
      4. Practical implications for human dignity
      5. Bridge-building questions
      6. Counterstrike scan (hypothetical influence campaign analysis)

  sentinel: >
    Independent forensic pass detecting AI-generated or synthetic content.
    Returns HUMAN (<20%), UNCERTAIN (20-60%), or SYNTHETIC (>80%).
    Tuned conservative — false positives worse than false negatives.

  counter_analyst: >
    Principled devil's advocate comment auto-seeded on every article.
    Transparently labeled (cyan styling + robot emoji). Solves the
    "empty dance floor" problem — gives readers something to push back against.

  character_commentary:
    description: Three AI personas comment on articles in rotation
    claude_shannon:
      color: emerald
      style: Meta-analyst — reads full dossier, information-theoretic framing
      shift: random (weight 0.7)
    chatgpt:
      color: teal
      style: Earnest overclaimer — enthusiastic, ties everything together too neatly
      shift: random (weight 0.5)
    gemini:
      color: blue
      style: Confident approximator — gets one benign detail wrong per comment
      shift: random (weight 0.35)
    on_off: "redis-cli -a simplenes set characters:enabled 1|0"
    posted_sets: "characters:posted:{handle} — SET per character, prevents duplication"

  translation:
    languages: 162
    source: frontend/lib/languages.json — 162 languages
    rtl_support: Arabic, Hebrew, Urdu, Persian, Pashto, Kurdish, Uyghur, Sindhi, Yiddish, Dhivehi
    behavior: Click Translate -> goes to preferred language (no dropdown). Globe icon to change.
    cache: 24h Redis cache per article+language pair
    note: Does NOT overwrite canonical article — translations are always ephemeral
    english_use_case: >
      English is first in the dropdown to support translating foreign-language articles
      into English. High-value use case: Aftenposten/NRC/Der Spiegel articles can be
      read by English speakers without leaving Arc Codex.

  auth:
    model: >
      Dual auth — GitHub OAuth (portable, zero config) + local username/password.
      Google and LinkedIn OAuth removed. Same credentials work across all stacks.
    local_auth:
      blueprint: backend/auth.py — Flask Blueprint, drop-in for any stack
      redis_db: 5 (shared across ALL stacks — register once, login everywhere)
      keyspace:
        users: "arc:users SET — all registered usernames"
        user: "arc:user:{username} HASH — password_hash, email, is_admin, created"
        email: "arc:email:{email} STR — username reverse lookup for reset"
        reset: "arc:reset:{token} STR — username, TTL 3600s"
      routes:
        - /auth/register
        - /auth/login
        - /auth/logout
        - /auth/forgot
        - /auth/reset/<token>
        - /auth/admin/users (admin only)
      password_reset: emails via local Postfix (same as mailer.py)
      admin_bootstrap: ARC_ADMIN_PASSWORD env var — creates admin user on first start
    github_oauth:
      app_name: Arc Codex
      client_id: Ov23liSxxBCqJjE7nXGM
      callback_url: https://arc-codex.com/api/auth/callback/github
      note: Works on all stacks with same credentials

  rss:
    endpoints: [/api/rss, /api/feed.xml]
    content: Full A.R.C. analysis in each item (Red/Blue/Purple + Chimera Score)
    filters: "?category=threat_intelligence, ?limit=10"

  core_principles:
    - "I. Attack ideas, never people"
    - "II. Model thinking, not conclusions"
    - "III. Invite inquiry, don't command belief"

  the_codex:
    total_patterns: 48
    foundational: [ARC-0001 Siren's Trap, ARC-0002 Deniability Decoy, ARC-0003 Wolf's Gambit, ARC-0004 Configuration Drift]
    schopenhauer: ARC-0005 to ARC-0042 (38 stratagems)
    modern: [ARC-0043 Motte-and-Bailey, ARC-0044 Gish Gallop, ARC-0045 Sealioning, ARC-0046 Kafka Trap, ARC-0047 Sanewashing]
    kalisti_principle: "You cannot exclude Eris from the party. She will lob the problem into your garden regardless."

# ==============================================================================
# SECTION 2: ADMIN
# ==============================================================================

admin:
  hardware:
    primary: HP Z230 SFF Workstation (192.168.1.198 LAN / 38.175.170.87 WAN)
    ai_inference: MacBook Air M1 (192.168.1.185) — ALL inference (analysis + translation)
    os: Ubuntu 24.04 LTS
    fd_limit: "65536 via /etc/systemd/system/itc-stack.service.d/limits.conf"
    disk:
      sdb2: "469GB primary (/), 70% used after moving newvid to /mnt/data"
      sda1: "3.6TB data drive (/mnt/data), 8% used"
      newvid: "Moved from /home/www/newvid to /mnt/data/newvid (83GB)"

  stacks:
    arc_codex:
      root: /home/www/arc_stack
      manager: arc.sh
      alias: arc
      backend_port: 5005
      frontend_port: 3000
      redis_db: 0
      solr_core: feeds
      domain: arc-codex.com
      systemd: itc-stack.service
      env: source /home/www/arc_stack/arc_env.sh
    huntaegis:
      root: /home/www/huntaegis_stack
      manager: huntaegis.sh
      alias: hnt
      backend_port: 5006
      frontend_port: 3002
      redis_db: 1
      solr_core: feeds_huntaegis
      domain: huntaegis.com
      systemd: huntaegis-stack.service
      env: source /home/www/huntaegis_stack/huntaegis_env.sh
      github: https://github.com/hapnesbitt/huntaegis
    neetwatch:
      root: /home/www/neetwatch_stack
      manager: neetwatch.sh
      alias: neetwatch
      backend_port: 5007
      frontend_port: 3003
      redis_db: 2
      solr_core: feeds_neetwatch
      domain: neetwatch.arc-codex.com
      systemd: neetwatch-stack.service
      env: source /home/www/neetwatch_stack/neetwatch_env.sh
      focus: social (youth disengagement, NEET, platform addiction, pro-social)
      note: >
        Provisioned Mar 20 2026 via provision.sh. Directives bug: token replacement
        overwrites directives.json — must manually install social directives after provision.
        Fix is in provision.sh v1.1 (exclude backend/directives.json from rsync).
    gemini_academy:
      root: /home/www/gemini_stack
      domain: gemini-academy.com
      hosting: GCP Cloud Run
      note: Solr connectivity issue — Cloud Run cannot reach localhost:8983 on Z230
    vid:
      root: /mnt/data/newvid
      domain: vid.arc-codex.com (also vid.mine.nu)
      port: 5102
      stack: Flask + Redis + Celery + Werkzeug auth
      note: >
        LightBox — video management platform with local Redis auth.
        No systemd unit — start manually: cd /mnt/data/newvid && source venv/bin/activate && ./gunicorn.sh
        Auth keyspace: users SET, user:{username} HASH (password_hash, is_admin)
        Vision: vid becomes media management backend for arc-codex — upload video,
        process/transcode, publish as article with embedded video + A.R.C. analysis.

  provision_sh:
    file: /home/www/arc_stack/provision.sh
    version: v1.1
    usage: |
      ./provision.sh \
        --name "Water Watch" --slug "waterwatch" \
        --domain "waterwatch.arc-codex.com" \
        --db 3 --backend-port 5008 --frontend-port 3004 \
        --focus general \
        --keywords "water scarcity, drought, aquifer depletion"
    focus_presets: [general, security, social, finance, health, arts]
    keywords: Optional — generates directives via Ollama if provided
    port_registry: /home/www/arc_stack/provision_registry.txt
    what_it_does: |
      1. Pre-flight: Redis/Solr/port checks, port registry collision check
      2. rsync arc_stack → new stack (excludes venv, node_modules, .next, logs, secrets,
         backup files, directives.json, monitoring/, Arc_dash.json)
      3. Token stamp all files: domain, ports, redis db, solr core, docker names, paths
      4. Patch Dockerfile.frontend for Alpine/musl SWC (avoids build failure)
      5. Create Solr core via API
      6. Generate directives.json from focus preset or Ollama keywords
      7. Create Python venv and pip install requirements
      8. Write arc_config.yaml, {slug}_env.sh, frontend/.env.local
      9. Create systemd unit, enable on boot
      10. git init -b main, first commit
      11. Print next steps (Caddy block, .env credentials, build+start)
    known_issues: |
      - gunicorn script kept as gunicorn_arc.sh (not renamed) — services array references it
      - musl SWC Dockerfile patch applied automatically
      - venv created automatically
      - git init now uses -b main (was defaulting to master)
      - directives.json excluded from rsync so focus preset is always written fresh
    next_steps_after_provision: |
      1. Edit backend/.env — set BLUESKY_HANDLE, BLUESKY_APP_PASSWORD, DOMAIN, MAIL_FROM
      2. Add Caddy block for new domain, sudo caddy reload
      3. source {slug}_env.sh && {slug} build && {slug} start
      4. redis-cli -n {db} set bluesky:autopost 1 (when ready)
      5. redis-cli -n {db} set characters:enabled 1

  arc_sh_commands:
    start:   "./arc.sh start [service]"
    stop:    "./arc.sh stop [service]"
    restart: "./arc.sh restart [service]"
    status:  "./arc.sh status"
    logs:    "./arc.sh logs"
    build:   "./arc.sh build"
    checkup: "./arc.sh checkup"
    backup:  "./arc.sh backup"
    prune:   "./arc.sh prune [dry]"
    restore: "./arc.sh restore"

  services:
    gunicorn:         {command: "./gunicorn_arc.sh", port: 5005, dir: "backend/", workers: 1, threads: 8, timeout: 600}
    scribe:           {command: "python3 scribe.py", note: "v52.0 — no Playwright, priority queue consumer"}
    manual_publisher: {command: "python3 manual_publisher.py", note: "v5.1"}
    stream_consumer:  {command: "python3 stream_consumer.py"}
    analyzer:         {command: "python3 analyzer.py"}
    mailer:           {command: "python3 mailer.py", note: "v1.0 ACTIVE — alerts + 7am digest"}
    bluesky_poster:   {command: "python3 bluesky_poster.py", note: "v1.1 — PNG→JPEG conversion, dedup, image upload"}
    character_builder:{command: "python3 character_builder.py", note: "v1.0 — Shannon/ChatGPT/Gemini rotation"}
    corpus_exporter:  {command: "python3 corpus_exporter.py", port: 9101, note: "Prometheus metrics for Grafana"}
    frontend:         {command: "docker compose up -d --no-deps frontend", port: 3000, note: "Docker container arc-frontend"}
    watchdog:         {command: "./watchdog.sh", note: "60s check loop, restarts crashed services"}

  boot:
    mechanism: systemd
    unit_file: /etc/systemd/system/itc-stack.service
    note: Unit name is legacy (itc era) — do not rename without testing
    after: [network-online.target, redis.service]

  bashrc_aliases: |
    source /home/www/arc_stack/arc_env.sh
    source /home/www/huntaegis_stack/huntaegis_env.sh
    source /home/www/neetwatch_stack/neetwatch_env.sh

  crontab:
    backup_ssd:  "0 3 * * * /home/www/arc_stack/arc.sh backup"
    backup_cold: "0 2 * * 0 /home/www/arc_stack/arc.sh backup-cold"
    note: SSD daily 3am (5 kept), cold archive weekly Sunday 2am (30 kept)

  backups:
    ssd_fast:
      location: /home/www/arc_stack/backups/
      naming: arc_backup_YYYY-MM-DD_HHMM.tar.gz
      retention: Last 5 tarballs
      excludes: node_modules, venv, .next, logs, pids, uploads
      cron: "0 3 * * *"
    cold_archive:
      location: /mnt/data/www/arc_stack_prod/
      naming: arc_cold_YYYY-MM-DD_HHMM.tar.gz
      retention: Last 30 archives
      includes: .next build, uploads, Redis RDB, Solr data
      cron: "0 2 * * 0"
      note: Stack stays up during cold backup — Redis BGSAVE + Solr commit flush before snapshot

  restore: "arc.sh restore — interactive picker, lists SSD + cold backups by number with sizes, requires typing yes, stops stack, extracts, restarts"

  log_management:
    locations: [logs/*.log, backend/*.log]
    rotation: Files >50MB get timestamp + gzip
    retention: 9 days

  reverse_proxy:
    server: Caddy (automatic HTTPS)
    config: /etc/caddy/Caddyfile
    version: v7.1
    critical_routing: |
      arc-codex.com block — ORDER MATTERS:
        handle /api/auth/* { reverse_proxy localhost:3000 }  # Next.js auth
        handle /api/user/* { reverse_proxy localhost:3000 }  # Next.js user prefs
        handle /api/*      { reverse_proxy localhost:5005 }  # Flask backend
        handle /auth/*     { reverse_proxy localhost:5005 }  # Local auth blueprint
        handle             { reverse_proxy localhost:3000 }  # Everything else → Next.js
    domains_configured:
      - arc-codex.com (ports 5005/3000)
      - huntaegis.com (ports 5006/3002)
      - neetwatch.arc-codex.com (ports 5007/3003)
      - vid.arc-codex.com (port 5102 — LightBox)
      - grafana.arc-codex.com (port 3001)
      - hapenews.mine.nu (legacy redirect)
      - itc.mine.nu / ogpt.mine.nu (legacy)

  redis:
    url: "redis://:simplenes@localhost:6379/0"
    password: simplenes
    admin_cli: "redis-cli -a simplenes"
    databases:
      0: arc-codex corpus
      1: huntaegis corpus
      2: neetwatch corpus
      5: shared auth (arc:users, arc:user:{username}) — ALL stacks
    translation_lock: "translation:active — TTL 300s. Prevents model thrashing on M1."

  ollama:
    host: "http://192.168.1.185:11434"
    architecture: "ALL inference on M1 — Z230 never used for inference"
    primary: "devstral cloud (weekly credit limit)"
    fallback: "gemma3:4b Q4_K_M (local on M1, 3.6GB)"
    translation_model: "MedAIBase/TranslateGemma:4b (M1, 7.8GB F16 — /api/chat required)"
    translation_fields_local: "[title, original_text] — 2 fields, speed constraint"
    translation_fields_pro: "[title, original_text, red_team_analysis, blue_team_analysis, purple_team_analysis]"

  bluesky:
    handle: hapenez.bsky.social
    stacks_posting: [arc-codex, huntaegis]
    on_off: "redis-cli -a simplenes -n {db} set bluesky:autopost 1|0"
    dedup_key: "bluesky:posted SET per stack"
    png_fix: PNG images converted to JPEG before upload (Bluesky corrupts large PNGs)
    default_image: "frontend/public/uploads/arc-codex-default.jpg (was PNG-disguised-as-JPG — fixed Mar 17)"

  grafana:
    url: https://grafana.arc-codex.com
    dashboard: "Arc Codex — Corpus Intelligence v2 (26 panels, 7 rows, 5m refresh)"
    dashboard_uid: arc-corpus-v2
    metrics_port: 9101
    exporter: backend/corpus_exporter.py

  email:
    mta: Postfix 3.10.2
    dkim: "selector: mail, domain: arc-codex.com"
    alert_to: rossnesbitt@gmail.com
    auth_status: "SPF: PASS, DKIM: PASS, DMARC: PASS"

  kasmir7:
    file: backend/kasmir7.py
    description: Interactive admin console v7
    functions: ["1-Search", "2-Emergency removal", "3-Trim", "4-Inspect", "5-Solr re-index",
                "6-Solr diagnostics", "7-Purge Solr orphans", "8-Purge Redis orphans",
                "11-My Publications"]

  nodejs:
    path: /home/ross/.nvm/versions/node/v22.16.0/bin
    note: Hardcoded in arc.sh PATH export and watchdog.sh

  env_files:
    backend_env: backend/.env
    frontend_env_local: frontend/.env.local
    new_vars_added_mar20: [DOMAIN, MAIL_FROM, ARC_ADMIN_PASSWORD]
    warning: >
      NEXT_PUBLIC_BACKEND_URL must be https://arc-codex.com in BOTH .env AND .env.local.
      .env.local has higher priority — a stale value here caused mobile to call localhost:5005.
      BACKEND_INTERNAL_URL=http://localhost:5005 is for server-side proxy only (not NEXT_PUBLIC_).

# ==============================================================================
# SECTION 3: DEVELOPER
# ==============================================================================

developer:
  stack:
    backend: "Python 3.x / Flask / gunicorn (port 5005, 1 worker, 8 threads, timeout 600)"
    frontend: "Next.js 16.1.6 / React 19 / TypeScript / Tailwind CSS / shadcn-ui"
    database: Redis
    search: "Apache Solr — core: feeds, fields: category, source_lang, original_text"
    ai: "Ollama on M1 — devstral cloud + gemma3:4b (analysis) + TranslateGemma:4b (translation)"
    auth: "Auth.js v5 (GitHub OAuth) + local auth blueprint (auth.py, Redis DB 5)"
    reverse_proxy: Caddy

  file_tree: |
    /home/www/arc_stack/
    ├── arc.sh
    ├── arc_env.sh
    ├── watchdog.sh
    ├── characters.yaml              # AI persona config (Shannon/ChatGPT/Gemini)
    ├── arc_config.yaml              # Operational config — ports, timeouts, toggles
    ├── provision.sh                 # v1.1 — rapid stack deployment
    ├── provision_registry.txt       # Port/DB registry for collision detection
    ├── Dockerfile.frontend          # Multi-stage Next.js, Alpine, musl SWC patch
    ├── Dockerfile.backend           # Python 3.11-slim
    ├── docker-compose.yml
    └── backend/
        ├── .env
        ├── main.py                  # Flask API — all endpoints
        ├── auth.py                  # Local auth blueprint (register/login/reset/admin)
        ├── scribe.py                # v52.0 — no Playwright, priority queue
        ├── analyzer.py
        ├── manual_publisher.py      # v5.1
        ├── stream_consumer.py
        ├── mailer.py                # v1.0 — alerts + 7am digest
        ├── bluesky_poster.py        # v1.1 — PNG→JPEG, image upload, dedup
        ├── character_builder.py     # v1.0 — Shannon/ChatGPT/Gemini commentary
        ├── corpus_exporter.py       # Prometheus exporter port 9101
        ├── ollama_utils.py          # WARNING: ONLY Ollama implementation
        ├── stream_utils.py
        ├── rss_feed.py
        ├── translation.py           # TranslateGemma:4b via /api/chat
        ├── user_prefs.py            # loopback-only security
        ├── prompts.yaml             # v6.2
        ├── kasmir7.py               # Admin console v7
        ├── gunicorn_arc.sh          # 1 worker, 8 threads, 600s timeout
        ├── sources.json             # 10,000+ RSS sources
        ├── directives.json          # arc-codex: general directives
        └── project_context.yaml    # THIS FILE

  api_endpoints:
    "GET /api/articles":           "paginated feed — ?limit=N&offset=N"
    "GET /api/articles/<id>":      "single article with full analysis"
    "POST /api/submit":            "submit URL/text for priority queue processing (async 202)"
    "POST /api/submit_prompt":     "generate article from prompt via Ollama (async 202)"
    "POST /api/submit_content":    "file upload — multipart, legacy filesystem path"
    "GET /api/search":             "Solr full-text — ?q=query&limit=N&sort=[recent|relevant|score_desc|score_asc]"
    "GET /api/stats":              "article_count, oldest, newest — polled every 30s by search page"
    "GET /api/translate/<id>":     "translate article — ?lang=<language name>"
    "DELETE /api/translate/<id>/cache": "admin cache bust"
    "GET /api/user/prefs":         "fetch prefs (via Next.js proxy)"
    "POST /api/user/prefs":        "upsert on login (loopback only)"
    "PATCH /api/user/prefs":       "update preferred_lang"
    "DELETE /api/user/prefs":      "GDPR deletion"
    "GET /api/rss":                "RSS 2.0 with full analysis"
    "GET /api/feed.xml":           "alias for /api/rss"
    "GET /api/post_bluesky":       "manual Bluesky post for article"
    "GET /api/config":             "live operational config — powers /about/developer/config"
    "GET /auth/register":          "local auth — register page"
    "GET /auth/login":             "local auth — login page"
    "GET /auth/logout":            "local auth — logout"
    "GET/POST /auth/forgot":       "local auth — password reset request"
    "GET/POST /auth/reset/<token>":"local auth — password reset with token"
    "GET /auth/admin/users":       "local auth — admin user management (admin only)"

  blueprint_registry: |
    app.register_blueprint(rss_blueprint)
    from translation import translation_bp;  app.register_blueprint(translation_bp)
    from user_prefs import user_prefs_bp;    app.register_blueprint(user_prefs_bp)
    from auth import auth_bp, init_auth;     app.register_blueprint(auth_bp)
    init_auth(app, redis_password=os.getenv("REDIS_PASSWORD"),
              domain=os.getenv("DOMAIN", "arc-codex.com"),
              from_addr=os.getenv("MAIL_FROM", "ross@arc-codex.com"))

  redis_schemas:
    article:      "article:{id} hash — id, title, url, source, original_text, timestamp, directive, category, source_lang, chimera_score, red/blue/purple_team_analysis, sentinel_verdict, og_image, slug, origin, visibility, owner"
    comment:      "comments:{article_id} list of JSON"
    reaction:     "reactions:{comment_id} hash — like, dislike, heart, happy, sad, angry"
    translation:  "translation:{article_id}:{lang} JSON TTL 24h"
    user_sso:     "user:{google_sub} hash — email, name, picture, preferred_lang, created_at, last_seen"
    user_local:   "arc:user:{username} hash — password_hash, email, is_admin, created (DB 5)"
    user_set:     "arc:users SET — all registered usernames (DB 5)"
    user_email:   "arc:email:{email} STR — username reverse lookup (DB 5)"
    reset_token:  "arc:reset:{token} STR — username, TTL 3600s (DB 5)"
    stream:       "analysis:pending Redis Stream / consumer group: analysis_workers"
    trans_lock:   "translation:active TTL 300s"
    bluesky:      "bluesky:autopost 1|0, bluesky:posted SET"
    characters:   "characters:enabled 1|0, characters:posted:{handle} SET"
    last_publish: "arc:last_publish ISO timestamp — set by scribe on every publish"
    mailer_dedup: "mailer:alerted:{key} TTL 3600s"

  auth_notes:
    local_auth_wiring: |
      auth.py is a Flask Blueprint — drop into backend/, register in main.py:
        from auth import auth_bp, init_auth
        app.register_blueprint(auth_bp)
        init_auth(app, redis_password=..., domain=..., from_addr=...)
      Decorators available: @login_required, @admin_required
      Helper: current_user() returns dict or None
    github_oauth:
      library: "next-auth@5.0.0-beta.30"
      strategy: JWT (no Redis adapter)
      trustHost: "REQUIRED in auth.ts"
    caddy_routing: |
      CRITICAL: /auth/* must route to Flask (5005), not Next.js (3000)
      Add before catch-all handle block:
        handle /auth/* { reverse_proxy localhost:5005 }
    shared_credentials: "Redis DB 5 is shared — same username/password works on arc-codex, huntaegis, neetwatch, vid"

  ai_notes:
    ollama_return: "call_ollama_with_fallback() returns TUPLE (text, duration_ms, model). Use result[0] for text."
    translation_danger: "NEVER auto-translate on feed mount — 33 cards x Ollama = gunicorn starvation. Click-only."
    translation_model: "TranslateGemma:4b needs /api/chat (NOT /api/generate), ISO 639-1 codes, system preamble, temp 0.2"
    translation_lock: "translation.py sets Redis translation:active. ollama_utils waits up to 60s before analysis calls."
    counter_analyst_author: "Must be exactly 'A.R.C. Counter-Analyst' — frontend styling depends on exact string"
    sentinel_fatal: false
    counter_analyst_fatal: false
    stream_delivery: "Redis Streams only — no filesystem JSON writes"
    character_builder: |
