developer:
  stack:
    backend: "Python 3.x / Flask / gunicorn (port 5005, 1 worker, 8 threads, timeout 600)"
    frontend: "Next.js 16.1.6 / React 19 / TypeScript / Tailwind CSS / shadcn-ui"
    database: Redis
    search: "Apache Solr — core: feeds, ~3800+ docs. Fields: category, source_lang, original_text."
    ai: "Ollama on M1 — devstral-2:123b-cloud → mistral:7b → llama3.2:latest (3-tier fallback)"
    auth: "Auth.js v5 (next-auth@5.0.0-beta.30) — Google + GitHub OAuth, JWT sessions"
    reverse_proxy: Caddy

  file_tree: |
    /home/www/arc_stack/
    ├── arc.sh
    ├── arc_env.sh
    ├── watchdog.sh                    # v2.0 — orphan detection + multi-stack support
    ├── docker-compose.yml
    ├── docker-compose.grafana.yml     # Prometheus + Grafana, restart: unless-stopped
    ├── monitoring/
    │   ├── prometheus.yml             # scrapes :9101 (corpus) + :9102 (traffic) + :9090
    │   └── grafana/provisioning/
    ├── backend/
    │   ├── .env
    │   ├── main.py                    # Flask API — pre_analyze v3.0 with full NLP fields
    │   ├── scribe.py                  # v52.1 — instrumented, RECENTLY_PUBLISHED_MEMORY=10, fallback publish
    │   ├── analyzer.py                # v1.0
    │   ├── manual_publisher.py        # v5.1
    │   ├── stream_consumer.py         # v1.0
    │   ├── mailer.py                  # v1.0 ACTIVE — alerts + digest, 4h cooldown
    │   ├── ollama_utils.py            # 3-tier fallback: devstral→mistral:7b→llama3.2
    │   ├── bluesky_poster.py          # v1.3 — zrange feed, url field direct
    │   ├── mastodon_poster.py         # v1.1 — zrange feed, write:media fixed
    │   ├── threads_poster.py          # v1.0 READY — needs .env tokens
    │   ├── caddy_exporter.py          # v1.0 — tails /var/log/caddy/*.log → Prometheus :9102
    │   ├── corpus_exporter.py         # v2.0 — NLP + pipeline health metrics → Prometheus :9101
    │   ├── arc_benchmark.py           # v3.0 — labeled runs, compare file, --compare flag
    │   ├── stream_utils.py
    │   ├── rss_feed.py                # Arc Codex branded
    │   ├── translation.py             # TranslateGemma:4b via /api/chat
    │   ├── user_prefs.py              # loopback-only security
    │   ├── prompts.yaml               # v6.2
    │   ├── directives.json            # v2.0 — 941 lines, 21 directives
    │   ├── kasmir7.py                 # Admin console v7.2 — options 12/13/14: sitemap/rss/news-sitemap
    │   ├── sync_intel.sh              # Hourly cron: regenerate sitemap+rss+news-sitemap, ping search engines
    │   ├── gunicorn_arc.sh            # 1 worker, 8 threads, 600s timeout
    │   ├── sources.json               # ~1200+ RSS sources
    │   └── project_context.yaml      # THIS FILE
    └── frontend/
