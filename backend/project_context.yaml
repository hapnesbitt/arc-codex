                ├── developer/page.tsx     # v6.1 — ARIA pass
                ├── contact/page.tsx
                ├── privacy/page.tsx
                └── terms/page.tsx

  api_endpoints:
    "GET /api/articles":           "paginated feed — ?limit=N&offset=N"
    "GET /api/articles/<id>":      "single article with full analysis"
    "POST /api/submit":            "submit URL/text/file for processing"
    "GET /api/search":             "Solr full-text — ?q=query&limit=N&sort=[recent|relevant|score_desc|score_asc]"
    "GET /api/stats":              "article_count, oldest, newest — polled every 30s by search page"
    "GET /api/translate/<id>":     "translate article — ?lang=<language name>"
    "DELETE /api/translate/<id>/cache": "admin cache bust"
    "GET /api/user/prefs":         "fetch prefs (via Next.js proxy)"
    "POST /api/user/prefs":        "upsert on login (loopback only)"
    "PATCH /api/user/prefs":       "update preferred_lang"
    "DELETE /api/user/prefs":      "GDPR deletion"
    "GET /api/rss":                "RSS 2.0 with full analysis — Arc Codex branded"
    "GET /api/feed.xml":           "alias for /api/rss"
    "POST /api/upload_image":      "upload cover image — auto-resized to 1200x630 JPEG via Pillow"
    "POST /api/post_bluesky":      "manual Bluesky post for article (account poster)"
    "POST /api/pre_analyze":       "NLP analysis — returns chimera_score, sentiment, NLP fields. Pass article_id to write nlp_* to Redis hash."

  blueprint_registry: |
    app.register_blueprint(rss_blueprint)
    from translation import translation_bp; app.register_blueprint(translation_bp)
    from user_prefs import user_prefs_bp;   app.register_blueprint(user_prefs_bp)

  redis_schemas:
    article: |
      article:{id} hash — id, title, url, source, original_text, timestamp, directive, category,
      source_lang, chimera_score, red/blue/purple_team_analysis, sentinel_verdict, og_image,
      slug, imageUrl, origin, visibility, owner
      + nlp_* fields (written by pre_analyze v3.0 when article_id passed):
        nlp_chimera_score, nlp_sentiment, nlp_vader_pos, nlp_vader_neg, nlp_vader_neu,
        nlp_subjectivity, nlp_objectivity, nlp_word_count, nlp_sentence_count,
        nlp_avg_sentence_len, nlp_syllable_count, nlp_noun_chunk_count,
        nlp_fk_grade, nlp_reading_level, nlp_coleman_liau, nlp_smog, nlp_dale_chall,
        nlp_entity_person, nlp_entity_org, nlp_entity_gpe, nlp_entity_loc,
        nlp_entity_date, nlp_entity_money, nlp_entity_event, nlp_top_lemmas
    comment:      "comments:{article_id} list of JSON"
    reaction:     "reactions:{comment_id} hash — like, dislike, heart, happy, sad, angry"
    translation:  "translation:{article_id}:{lang} JSON TTL 24h — {title, original_text, rtl} (local) or 5-field (pro)"
    user_sso:     "user:{google_sub} hash — email, name, picture, preferred_lang, created_at, last_seen"
