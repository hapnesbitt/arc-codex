  frontend_gotchas:
    feedclient: "NEVER restructure — surgical deletions only"
    layouttheme: "Check LayoutTheme.module.css first for any color issues"
    user_prefs_import: "From @/components/UserPrefsContext — NOT @/hooks/useUserPrefs"
