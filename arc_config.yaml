# arc_config.yaml — Arc Codex Operational Configuration
# VERSION 1.0 — Mar 16, 2026
# Safe to expose publicly — no secrets, no credentials.
# Services read this file directly. Replaces hardcoded constants in Python daemons.
#
# SECRETS live in backend/.env only — never here.
# NARRATIVE/HISTORY lives in project_context.yaml — not here.

stack:
  name: "Arc Codex"                        # Display name (huntaegis: "Huntaegis")
  domain: "arc-codex.com"                  # Primary domain
  handle: "hapenez.bsky.social"            # Bluesky handle (read by bluesky_poster)
  root: "/home/www/arc_stack"
  backend_port: 5005
  frontend_port: 3000
  redis_db: 0                              # huntaegis uses db 1
  solr_core: "feeds"                       # huntaegis uses feeds_huntaegis

ollama:
  host: "http://192.168.1.185:11434"
  primary_model: "gpt-oss-20b"             # cloud model (weekly credit limit)
  fallback_model: "gemma3:4b"
  translation_model: "MedAIBase/TranslateGemma:4b"
  translation_fields: "pro"               # "local" = [title, original_text] only
                                           # "pro"   = all 5 fields

scribe:
  cycle_sleep_seconds: 60                  # Total sleep between RSS cycles (was 600)
  cycle_sleep_interval: 1                  # Sleep chunk size in seconds
  max_concurrent_analyzers: 4
  priority_queue_key: "scribe:priority_uploads"

bluesky:
  autopost: true                           # Runtime: also controlled via Redis bluesky:autopost
  jitter_min_seconds: 0                    # Set >0 in production to avoid burst posting
  jitter_max_seconds: 0
  counter_analyst_wait_seconds: 60
  poll_interval_seconds: 15

linkedin:
  autopost: true                           # Runtime: also controlled via Redis linkedin:autopost
  jitter_min_seconds: 30
  jitter_max_seconds: 180
  counter_analyst_wait_seconds: 60
  poll_interval_seconds: 15

mailer:
  alert_to: "rossnesbitt@gmail.com"
  digest_hour: 7                           # 7am daily digest
  stall_threshold_hours: 2                 # Alert if no new articles in N hours
  log_scan_interval_seconds: 60
  log_lookback_minutes: 2

translation:
  cache_ttl_hours: 24
  lock_key: "translation:active"
  lock_ttl_seconds: 300
  ollama_backoff_seconds: 60

feed:
  default_page_size: 33
  max_page_size: 100

backups:
  ssd_keep: 5
  cold_keep: 30
  ssd_cron: "0 3 * * *"
  cold_cron: "0 2 * * 0"

# ── Cloud escalation gate (Option A-tightened) ────────────────────────────────
# Analyzer runs local first; article escalates to cloud only when one of
# escalation.py's three triggers fires. Cloud characters (council) fire on
# cloud only when the article's escalation_score meets council_escalation_score.
#
# weekly_cap is a HARD backstop against the ~82% projected burn — when hit
# mid-week, everything falls to local (labelled local_full or local_partial)
# instead of failing loudly. Counter: arc:cloud_calls:weekly:<isoweek>.
#
# advertorial-prone sources are MEASURED (auto-promoted from rolling stats),
# never hand-curated — no pre-emptive editorial judgment on sources.
escalation:
  heuristic_threshold: 4          # vendor-signal score in article to trigger T2
  new_source_cold_start_n: 10     # articles before source_stats stabilize
  weekly_cap: 400                 # cloud calls per ISO week (hard backstop)
  council_escalation_score: 2     # article escalation_score gate for cloud council

services:
  # name: enabled
  gunicorn: true
  scribe: true
  analyzer: true
  stream_consumer: true
  manual_publisher: true
  mailer: true
  linkedin_poster: true
  bluesky_poster: true
  corpus_exporter: true
  frontend: true
  watchdog: true
