# logrotate config for arc_stack — runs as ross via cron.
# Not installed to /etc/logrotate.d/ (would need sudo). Invocation:
#
#   0 5 * * 0 /usr/sbin/logrotate -s /home/www/arc_stack/logs/.logrotate.state \
#     /home/www/arc_stack/ops/logrotate.conf >> /home/www/arc_stack/logs/logrotate.log 2>&1
#
# copytruncate — gunicorn/scribe keep their fd open; copytruncate copies then
# truncates in place, so log writes continue to the same fd without needing a
# SIGUSR1/restart hook. Tradeoff: writes during the copy→truncate window can be
# duplicated or lost. For access/error logs this is acceptable; anyone relying
# on exact per-request accounting should read the archived .gz.

/home/www/arc_stack/logs/gunicorn_access.log
/home/www/arc_stack/logs/gunicorn_error.log
/home/www/arc_stack/logs/scribe.log
{
    # daily + rotate 9 mirrors [backup].log_days = 9 (arc.cfg), the single
    # source of truth for log retention. arc.sh's cfg-driven prune is the
    # authority; this keeps logrotate from retaining beyond that window.
    daily
    rotate 9
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}
