# Caddy snippet — CORS for /uploads/audio/, scoped to newsradio only
# Prepared 2026-09-04, not applied — requires Ross's sudo. See
# ops/RUNBOOK.md (2026-09-04 entry) for why: newsradio_stack's player wires
# every track through a Web Audio graph (createMediaElementSource, for the
# equalizer), and a cross-origin source with no CORS grant plays silently —
# loads, decodes, advances currentTime/duration, fires canplay/playing, no
# error event, just zero audible output. Same-origin (newsradio's own
# copied category tracks) is unaffected either way.
#
# Scoped to exactly this one path and exactly this one origin — NOT
# site-wide, NOT `*`. /uploads/scraped/* and the general /uploads/* handler
# right below it are untouched.
#
# --- Install ---
# 1. Open /etc/caddy/Caddyfile, find the arc-codex.com site block.
# 2. Insert the block below immediately BEFORE the existing
#      handle /uploads/* {
#    block (currently the line right after /uploads/scraped/*'s closing
#    brace — same site block, same indentation level as its neighbors).
# 3. sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy
#
# --- Verify ---
#   curl -sI -H "Origin: https://newsradio.arc-codex.com" \
#     https://arc-codex.com/uploads/audio/<any-existing-id>.mp3 \
#     | grep -i access-control-allow-origin
#   # expect: access-control-allow-origin: https://newsradio.arc-codex.com
#
#   curl -sI -H "Origin: https://evil.example" \
#     https://arc-codex.com/uploads/audio/<any-existing-id>.mp3 \
#     | grep -i access-control-allow-origin
#   # expect: no output — the header is a fixed value, not a reflected
#   # Origin, so an unrelated origin gets no CORS grant at all.

	handle /uploads/audio/* {
		root * /home/www/arc_stack/frontend/public
		# Fixed value, not a reflected $request.header.Origin — this origin
		# gets the grant regardless of what Origin a request carries, and
		# every other origin gets nothing. Vary: Origin is defensive-only
		# (the response body/other headers never differ by Origin here) but
		# keeps any intermediate cache from conflating this with a future
		# per-origin policy if one is ever added.
		header Access-Control-Allow-Origin "https://newsradio.arc-codex.com"
		header Vary "Origin"
		file_server
	}
