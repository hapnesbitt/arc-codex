# arc.cfg — per-site configuration, schema v2 (2026-07-21)
#
# Everything that differs between sites lives here; code is identical across
# stacks. Secrets stay in backend/.env — the loader refuses to start if a key
# here looks like one. Loaded by backend/site_config.py; cross-site isolation
# invariants enforced by backend/validate_sites.py.
#
# Values are the committed cross-stack defaults as of 2026-07-21 (audit
# effective-runtime column where flagged). Tuning is a separate later pass.

[site]
name       = "Arc Codex"
slug       = "arc"
domain     = "arc-codex.com"
base_url   = "https://arc-codex.com"
stack_path = "/home/www/arc_stack"

[network]
backend_port  = 5005
frontend_port = 3000
cors_origins  = ["https://arc-codex.com", "https://www.arc-codex.com"]
# backend_internal_url derives: http://127.0.0.1:{backend_port}

[gunicorn]
# Retuned 2026-08-21 from measured load: 5-day access-log peak was 54
# concurrent requests (p50=2, p99=29), against the old 20x8=160 slots. 8x10=80
# clears the peak with ~48% headroom. Now actually wired to gunicorn_arc.sh
# (grep -oP, same as log_days/log_max_mb) -- until this change, this section
# was parsed by site_config.py and never read back by anything; the real
# worker count was hardcoded separately in the launcher and had drifted to 20.
workers = 8
threads = 10
timeout = 600

[storage]
redis_host = "localhost"
redis_port = 6379
redis_db   = 0        # unique per site — the invariant that isolates generic keys
solr_core  = "feeds"

[backup]
cold_dir       = "/mnt/arcdata/backups"
# warm dir derives: {stack_path}/backups
warm_retention = 5
cold_retention = 4
log_days       = 9
log_max_mb     = 50
# Warm (SSD) archives are code+config only; scraped hero images are large and
# re-scrapeable, so they are excluded from the warm tar unless this is true.
include_scraped_images = false

[retention]
# Article age cutoff for scribe's end-of-cycle prune. 30 days on both sites
# for search-index stability (Ross, 2026-07-21). Required — a missing value
# fails site_config load loudly rather than silently disabling pruning.
article_hours = 720
# Scraped hero-image age cutoff for cleanup.py's unreferenced-image purge.
# Images older than this are deleted only when no live article/Solr doc refs them.
image_days = 9
# Age cutoff for cleanup.py's weekly prune of the facebook/bluesky/mastodon/
# threads :posted ZSETs (member=article id, score=post unix ts — the only
# anti-duplicate-repost guard the social posters have). The 9-day image_days
# above is a floor for "how long could a duplicate realistically resurface",
# not the answer here: an id can only be re-ingested (same md5(title+
# snippet) hash) while retention.py might still trim its ORIGINAL article
# out from under it, and that trim doesn't happen until article_hours above
# (720h = 30d) has passed. Pruning a :posted entry earlier than that reopens
# the repost window before the original story is even gone. 60d = 2x
# article_hours in days: the original article's full 30-day natural life,
# plus a 30-day buffer past that for a duplicate to surface and still be
# caught. Retune here if real-world re-ingestion turns out to run longer.
posted_set_days = 60

[inference]
ollama_url  = "http://192.168.1.185:11434"
council_url = "http://localhost:11434"
# primary_url / fallback_url / translation_url default to ollama_url

# Council context window. gemma4:e2b's KV cache scales with num_ctx, but on
# the Z230 (no GPU, --no-mmap chosen by Ollama) the bulk of RSS is the ~7 GB
# of Q4_K_M weights held in anon pages — halving num_ctx from 8192 → 4096
# measured a ~440 MB llama-server RSS drop (7.63 → 7.19 GB, 2026-08-22),
# not the multi-GB win an eyeball guess suggests. Real leverage against RAM
# pressure on this box comes from the model evicting entirely (default 5 min
# TTL). Sized against 24 h of live traffic: max prompt = 2329 tok, num_predict
# = 1024 → worst-case working context 3353 tok, so 4096 leaves 743 tok
# headroom. Threaded through _council_payload; if real prompts outgrow this,
# it'll surface as prompt-truncation warnings in scribe.log.
council_num_ctx = 4096

[models]
cloud       = "gemma4:31b-cloud"
local       = "gemma4:e2b"
general     = "gemma4:e2b"
character   = "gemma4:e2b"   # effective runtime (code default gemma3:4b is dead)
quiz        = "gemma4:e2b"
translation = "MedAIBase/TranslateGemma:4b"   # verify actual model before Arc migrates translation

[ingestion]
cycle_minutes       = 97 
startup_delay_s     = 1
sources_per_sweep   = 13
concurrent_scrapers = 5
concurrent_preproc  = 10
fetch_timeout_s     = 15
feed_timeout_s      = 30
courtesy_delay_s    = 2.5
sources_file        = "backend/sources.json"

# Startup guard against an unexpectedly-small sources.json. sources.json is
# JSONL: a truncated file parses cleanly line by line, every remaining record
# is still valid JSON, and every downstream stage (feed parse, sweep, dedup,
# storage) keeps working on the fragment. An unintended shrink therefore
# produces no error signal anywhere — scribe just quietly sweeps a fraction
# of the corpus.
#
# Bands:
#   count < min_sources  → ERROR + refuse to start (probable clobber)
#   count < warn_sources → WARNING + start (likely deliberate prune)
#   count ≥ warn_sources → INFO with count
#
# Numbers reflect real use: arc's corpus is ~2,310, prunes historically land
# in the low hundreds, and Ross experiments directly on the working-tree file
# (partitioning tests, source-subset sweeps) — a floor that fires on
# legitimate operator work becomes one operators disable. 1500/2000 catches
# a writer clobbering the file (which lands in the tens or low hundreds)
# without false-tripping a real prune.
#
# ARC_ALLOW_SMALL_SOURCES=1 downgrades the hard refusal to a WARNING for
# one run so deliberate small-corpus experiments don't need a cfg edit.
# The override is logged loudly at ERROR so a forgotten flag stays visible.
# Set either bound to 0 to disable that band.
[integrity]
min_sources  = 1500
warn_sources = 2000

[pipeline]
sentinel_timeout_s        = 900
ca_timeout_s              = 900
background_workers        = 2
analyzer_pop_s            = 5
analysis_hold_ttl_s       = 600
analysis_max_chars        = 100000   # p95 truncated article is 94k; fits 32k-token ctx
analysis_garbage_chars    = 250000   # beyond this: page dump — skip analysis, log source
character_feed_poll_s     = 20
character_analysis_wait_s = 120
character_analysis_poll_s = 10
character_retry_backoff_s = 600
character_giveup_days     = 7
character_max_attempts    = 12       # real generation failures; quota 429s don't count
council_load_gate         = 3.0

[posters]
poll_s        = 15
ca_wait_s     = 120
fb_jitter     = [30, 180]
fb_cooldown_h = 6
bsky_login_refresh_min = 90

[posters.bluesky]
handle = "arc-codex.com"   # DECIDED shared across all sites (Ross, 2026-07-21)

[posters.mastodon]
instance = "https://mastodon.social"

[branding]
rss_title     = "Arc Codex — A.R.C. Intelligence Feed"
rss_generator = "Arc Codex A.R.C. Framework"
guid_prefix   = "arc-codex-"
mail_sender   = "ross@arc-codex.com"
default_image = "/uploads/arc-codex-default.jpg"

[services]
enabled = [
  "gunicorn", "frontend", "watchdog",
  "scribe", "analyzer", "character_builder",
  "bluesky_poster", "mastodon_poster", "facebook_poster",
  "manual_publisher", "mailer", "stream_consumer",
  "quiz_generator", "corpus_exporter", "caddy_exporter",
]

[extraction]
# CAPTCHA-boilerplate defense (2026-08-28) — see backend/scribe.py
# assess_content_quality and backend/playwright_tier3.py:_fetch_with_supervisor.
#
# Trafilatura extracting from a CAPTCHA/Cloudflare-checkpoint page produces
# the CHECKPOINT'S OWN text (a 1,230-1,250 char cluster of "checking your
# browser…" boilerplate), and the "extraction succeeded" gates before this
# had no way to tell that from a real short article. Left unchecked those
# extracts got published, hashed as unique articles, AND narrated by Kokoro
# — the audio pipeline's AUDIO_MIN_CHARS=100 gate clears 1,234 chars easily,
# so a listener got ~90s of af_heart pronouncing "cloudflare-ray-id". A
# 7-week audit (2026-07-11 → 2026-08-28) found 424 short-CAPTCHA extracts
# across 12 arc sources, some fraction of which became published narrations.
# Retention (720h) clears the existing bad tail once intake is fixed.
#
# The 1,800 floor is set from the histogram: 1,230-1,250 is the boilerplate
# cluster, then a clean gap to 6,000+ chars for real articles served with
# a CAPTCHA banner (science.org medical coverage was the canonical
# keep-me case at 6,352 chars). 1,800 clears all observed boilerplate with
# ~4,500 chars of headroom before it bites anything legitimate — that
# headroom absorbs Cloudflare wording changes without a code edit.
#
# CLAMPED: site_config raises the effective value to the hardcoded floor
# (backend/scribe.py MIN_ARTICLE_CHARS_CAPTCHA_FLOOR = 800) if this is set
# below it — a stray zero must not silently disable the defense.
min_article_chars_captcha = 1800

[quiz]
# Automatic refresh is intentionally disabled; operators can still run
# backend/quiz_generator.py --once when a manual refresh is wanted.
auto_generation_enabled = false
cycle_minutes = 300
lock_ttl_s    = 600

[audio]
# audio_backfill.py is the SOLE narrator (merged 2026-08-27 — scribe.py's own
# _run_audio_pass/_find_silent_article/_audio_scan_window are retired). They
# used to run as two independently-implemented selectors against the same
# feed, and only the daemon took the arc:audio:active Redis mutex — scribe's
# pass had no exclusion against it at all. That let the two land on the same
# newest-silent article and run two concurrent Kokoro subprocesses for it,
# each blowing the other's AUDIO_TIMEOUT_SECONDS budget. See ops/RUNBOOK.md
# 2026-08-27 for the incident and merge decision.
#
# Peak-hour window — half-open [start, end): 14 ≤ hour < 19 by default.
# peak_weekdays_only = true means weekends are never gated (Sat/Sun reads are
# for coffee, not work). This used to be a full blackout (the daemon idled
# through it) with scribe's separate pass quietly covering breaking news
# during the window instead. Now that there's one narrator, a full blackout
# would mean nothing gets narrated for up to 5 hours on a weekday — so the
# daemon instead THROTTLES during this window: it keeps polling every 30s
# (POLL_SECONDS in audio_backfill.py) but only allows itself one mutex
# acquire per peak_throttle_minutes, matching the cadence scribe's old
# per-cycle pass used to provide. Outside the window it runs at full
# sliding-window speed (an acquire as often as there's a silent article).
peak_start_hour       = 14
peak_end_hour         = 19
peak_weekdays_only    = true
peak_throttle_minutes = 95

# audio_backfill.py's trailing window (2026-08-27 redesign — see
# ops/RUNBOOK.md). Every pass it narrates the newest silent article
# published within the last backfill_window_hours; older silence is
# permanently skipped, deliberately — this narrates breaking news, not a
# backlog. Clamped floor..ceiling so a wide value can't turn this back into
# the full batch backfill the redesign replaced (Ross's config rule: an
# operator-tunable value still needs a bound that can't be silently
# misconfigured into the thing it was designed against).
backfill_window_hours         = 2
backfill_window_floor_hours   = 0.25
backfill_window_ceiling_hours = 6

# Poison-pill guard (2026-08-27 — see ops/RUNBOOK.md; revisited 2026-09-03
# after cutover to spectre). An article whose estimated synthesis time
# (chars / estimated_synthesis_cps) exceeds AUDIO_TIMEOUT_SECONDS (600s,
# scribe.py) can never finish — dc73d5ad4b60 was 16,479 chars needing
# ~1,100s. Without this it re-enters the candidate window and burns a full
# 600s timeout on every daemon restart.
#
# What matters here is WALL-CLOCK chars/s, not the audio (speech) rate —
# those are different numbers. The 2026-08-27 value of 15 was measured
# from historical logs where Kokoro on resolute was slow enough that the
# two were effectively the same, and the name "chars/s" masked that they
# aren't. On spectre they diverge: 23 successful narrations 2026-09-03
# morning ranged 12.5-32.9 chars/s wall (median 23.7) while the audio
# rate was still ~15. Against the wall rate the old 9,000-char threshold
# was skipping about half of every pass on articles synthesis could
# comfortably have finished — including several near-misses (9224, 9328,
# 9479, 9496, 9821) that would have fit an ~11k budget.
#
# 18.34 * 600s ≈ 11,000 chars: a conservative bump from 9,000, chosen to
# clear the near-misses without lifting the guard to the median-derived
# ~14,200. Still catches the poison-pill class (16k+, 20k+, 40k+ char
# articles) so restart-cycle burn is preserved. The real fix is moving
# the 600s timeout from per-article to per-chunk (Kokoro already splits
# and synthesizes sequentially), which removes the length ceiling
# entirely; that's the next thing to reach for, not another bump.
#
# Known cost of 18.34, observed live 2026-09-03: articles in the 9k-11k
# band at wall rates below ~16.5 chars/s burn the full 600s before
# skipping — the 9940-char article that motivated this raise (656c30ce)
# did exactly that on the first pass. One 600s burn per ~5-8 recovered
# articles is the accepted trade; Step 2 (per-chunk timeout) is what
# removes it. Sample wall-cps that pass: min 16.72, median 22.36, max
# 23.30 over 8 completions.
estimated_synthesis_cps = 18.34

[monitoring]
exporter_port       = 9101
caddy_exporter_port = 9102
exporter_interval_s = 3600
grafana_port        = 3001
prometheus_port     = 9090
alertmanager_port   = 9093
# Arc owns cross-stack operational monitoring: the corpus_exporter fast loop
# reads BOTH stacks' scribe/analyzer/intel heartbeats (stack-labeled) from this
# one process. Hunt runs the identical exporter with this false so it doesn't
# duplicate that loop.
cross_stack_operational = true

[health]
backend_interval_s  = 30
backend_timeout_s   = 10
backend_retries     = 3
frontend_start_s    = 20
watchdog_interval_s = 60
