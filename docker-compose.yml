# =============================================================================
# Arc Codex — docker-compose.yml
# Full stack: 6 backend services + 1 frontend + redis + solr
#
# Redis and Solr run natively on the Z230 — services reach them via
# host.docker.internal (Docker Desktop) or via host network mode on Linux.
name: arc-codex
#
# Usage:
#   docker compose up -d              # start all
#   docker compose up -d scribe       # start one service
#   docker compose logs -f scribe     # tail logs
#   docker compose restart analyzer   # restart one
#   docker compose down               # stop all
#
# First run:
#   cp backend/.env.example backend/.env
#   cp frontend/.env.local.example frontend/.env.local
#   docker compose build
#   docker compose up -d
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  # Redis and Solr are native on Z230 — not managed by compose.
  # If you later containerize them, uncomment the blocks at the bottom.

  # ── Backend: API ────────────────────────────────────────────────────────────
  gunicorn:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    image: arc-codex-backend:latest
    container_name: arc-gunicorn
    command: ["./gunicorn_arc.sh"]
    ports:
      - "5005:5005"
    env_file: ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/api/get_feed?limit=1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Backend: Workers ────────────────────────────────────────────────────────
  scribe:
    image: arc-codex-backend:latest
    container_name: arc-scribe
    command: ["python3", "scribe.py"]
    env_file: ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gunicorn:
        condition: service_healthy
    restart: unless-stopped

  manual_publisher:
    image: arc-codex-backend:latest
    container_name: arc-manual-publisher
    command: ["python3", "manual_publisher.py"]
    env_file: ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gunicorn:
        condition: service_healthy
    restart: unless-stopped

  stream_consumer:
    image: arc-codex-backend:latest
    container_name: arc-stream-consumer
    command: ["python3", "stream_consumer.py"]
    env_file: ./backend/.env
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gunicorn:
        condition: service_healthy
    restart: unless-stopped

  analyzer:
    image: arc-codex-backend:latest
    container_name: arc-analyzer
    command: ["python3", "analyzer.py"]
    env_file: ./backend/.env
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gunicorn:
        condition: service_healthy
    restart: unless-stopped

  mailer:
    image: arc-codex-backend:latest
    container_name: arc-mailer
    command: ["python3", "mailer.py"]
    env_file: ./backend/.env
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gunicorn:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────────────────
  # network_mode: host — shares host network stack so 127.0.0.1:5005
  # resolves to native gunicorn. Caddy remains the TLS edge.
  # ports/extra_hosts removed — incompatible with host network mode.
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:-https://arc-codex.com}
        SW_CACHE_STAMP: ${SW_CACHE_STAMP:-dev}
    image: arc-codex-frontend:latest
    container_name: arc-frontend
    network_mode: host
    env_file: ./frontend/.env.local
    # D5 fix (2026-07-11): bind /app/.next/cache to arcdata so the Next.js
    # server-side fetch cache stops inflating the container's writable
    # layer (measured 8 GB/day of library-payload cache pre-fix, on root
    # disk). Bytes now land on sda1 (191 GB free). Cache persists across
    # container recreates → warmer performance after deploys.
    volumes:
      - /mnt/arcdata/docker-caches/arc-frontend-next:/app/.next/cache
      # Uploads are served from the host, not baked into the image (2026-07-23).
      # 34k hero images + WebP variants = 2.1 GB that next build never reads;
      # baking them made every rebuild copy and export that layer (~250s of a
      # 256s build). Read-only: the backend (uid 1000) writes here, the
      # container (uid 1001) only serves. The 35 non-upload files in public/
      # — fonts, icons, ads.txt — stay in the image.
      #
      # If this directory is missing at container start, Docker creates it as
      # root:root and the backend can no longer write heroes. `arc.sh` runs
      # ensure_uploads_dir() before every frontend start to prevent that.
      - ./frontend/public/uploads:/app/public/uploads:ro
    depends_on:
      gunicorn:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

# =============================================================================
# Shared log volume — all services write to ./logs on the host
# =============================================================================
volumes:
  logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

