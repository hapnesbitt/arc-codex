version: '3.8'

services:
  # --- Core Infrastructure with Persistent Volumes (on HDD) ---
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /mnt/data/arc_codex/redis:/data # Persistent HDD storage for Redis
    networks:
      - arc_network

  solr:
    image: solr:9
    restart: always
    volumes:
      - /mnt/data/arc_codex/solr:/var/solr # Persistent HDD storage for Solr
    networks:
      - arc_network

  # --- Application Components (built from source on SSD) ---
  backend:
    build:
      context: ./backend # Source code on your fast SSD
      dockerfile: Dockerfile
    restart: always
    env_file: ./backend/.env
    ports:
      - "5005:5005"
    depends_on:
      - redis
      - solr
    networks:
      - arc_network

  frontend:
    build:
      context: ./frontend # Source code on your fast SSD
      dockerfile: Dockerfile
    restart: always
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - arc_network

  # --- Application Networks ---
  arc_network:
    driver: bridge
