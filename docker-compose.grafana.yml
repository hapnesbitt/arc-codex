# =============================================================================
# Arc Codex — docker-compose.grafana.yml
# Corpus intelligence observability stack: Prometheus + Grafana
#
# corpus_exporter.py runs NATIVELY on Z230 (not containerized) at :9101
name: arc-observability
# so it can reach Redis directly without extra_hosts gymnastics.
#
# Usage:
#   docker compose -f docker-compose.grafana.yml up -d
#   docker compose -f docker-compose.grafana.yml down
#   docker compose -f docker-compose.grafana.yml logs -f
#
# Or via arc.sh:
#   arc grafana-start
#   arc grafana-stop
#   arc grafana-status
#
# Access: https://grafana.arc-codex.com  (Caddy → localhost:3001)
# Default login: admin / arccodex  (change in Grafana UI after first login)
# =============================================================================

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: arc-prometheus
    network_mode: host
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.listen-address=localhost:9090'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: arc-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: 3001
      GF_SERVER_DOMAIN: grafana.arc-codex.com
      GF_SERVER_ROOT_URL: https://grafana.arc-codex.com
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: arccodex
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/corpus.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
