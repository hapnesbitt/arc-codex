# Wave C R6 — Arc alert rules (2026-07-11)
# Loaded by prometheus.yml → rule_files.
# Thresholds set so today does not page; register for later tuning.

groups:

  - name: arc_liveness
    interval: 30s
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }}/{{ $labels.instance }} down for 5m"
          description: "The scraper cannot reach {{ $labels.instance }} in job {{ $labels.job }}. This is either the exporter, the box, or the network path."

  - name: arc_pipeline
    interval: 60s
    rules:
      - alert: ArcFeedStale
        # corpus_last_publish_timestamp is the newest article's ts (site-labeled
        # after the exporter rename; scoped to site="arc" so Hunt's series can't
        # satisfy Arc's alert). Set to 0 on empty feed → NaN in this expr, alert
        # stays off.
        expr: (time() - corpus_last_publish_timestamp{site="arc"}) > 10800  # 3h
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Arc feed has not published a new article in 3h"
          description: "Newest article age: {{ $value | humanizeDuration }}. Investigate scribe.log for source failures or a fetch outage."

  - name: arc_capacity
    interval: 30s
    rules:
      # Root and /mnt/arcdata each get their own alert so a page tells you which.
      # Root is at ~87% today; 90% keeps us quiet now, tightens the runway.
      - alert: DiskRootFullish
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem below 10% free"
          description: "{{ $value | humanizePercentage }} free on /"
      - alert: DiskArcdataFullish
        expr: (node_filesystem_avail_bytes{mountpoint="/mnt/arcdata"} / node_filesystem_size_bytes{mountpoint="/mnt/arcdata"}) < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "/mnt/arcdata below 10% free"
          description: "{{ $value | humanizePercentage }} free — cold-backup retention + library.db live here."

      - alert: RedisMemoryHigh
        # arc_redis_memory_ratio is used/maxmemory (0-1). corpus_exporter
        # already computes it; alert at 80%.
        expr: arc_redis_memory_ratio > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 80% of maxmemory"
          description: "used_memory / maxmemory = {{ $value | humanizePercentage }}. maxmemory is 16 GB; investigate keyspace growth."

  - name: prediger_offsite
    # R-PT2 (2026-07-17) — metrics come from ops/pull_prod_backups.sh in the
    # prediger repo, via the node-exporter textfile collector
    # (monitoring/textfile/prediger_backup.prom). The pull runs once daily at
    # 04:30, so short `for` windows cost nothing: these gauges cannot flap.
    interval: 60s
    rules:
      - alert: PredigerBackupStale
        # The last pull failed, or the newest dump on Horst's box is >48h old
        # (backup.py there silently dead). age -1 = unknown; the exit-code arm
        # of the expression covers that case.
        expr: prediger_backup_newest_dump_age_seconds > 172800 or prediger_backup_pull_exit_code != 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prediger offsite backup stale or last pull failed"
          description: "Check logs/pull_backup_cron.log on Resolute for R-PT1 ALERT lines; then backup_cron.log on predigertoday.com."
      - alert: PredigerPullDead
        # Dead-man switch: fires when the pull job stops REPORTING at all —
        # crontab lost, box rebooted wrong, key revoked, spool unmounted. A
        # tripwire that only fires when the script runs is half a tripwire.
        # 26h = daily cadence + 2h grace.
        expr: absent(prediger_backup_last_pull_timestamp) or (time() - prediger_backup_last_pull_timestamp) > 93600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Prediger pull-backup job has not reported in >26h"
          description: "No prediger_backup_last_pull_timestamp metric or it is too old — the cron may not be running at all. Check Resolute's crontab and logs/pull_backup_cron.log."
