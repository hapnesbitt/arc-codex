# =============================================================================
# Arc Codex — prometheus.yml
# Scrapes corpus_exporter.py running natively at localhost:9101
# Scrapes caddy_exporter.py running natively at localhost:9102
# =============================================================================

global:
  # Global scrape default — per-job overrides below (corpus is on 2m, node/
  # traffic on 15s).
  scrape_interval:     60s
  # Wave C R6 (2026-07-11) — rule-eval MUST be short enough for
  # capacity/liveness alerts to fire promptly. Was 60m; that made every
  # rule effectively silent. Corpus scrape frequency is now the per-job
  # scrape_interval below, not the global.
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:

  - job_name: 'arc_corpus'
    static_configs:
      - targets: ['localhost:9101']
    scrape_interval: 2m
    scrape_timeout:  120s    # full corpus scan can take ~30s on 2000+ articles

  - job_name: 'arc_traffic'
    static_configs:
      - targets: ['localhost:9102']
    scrape_interval: 15s     # traffic metrics update in real-time
    scrape_timeout:  10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5m

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
    scrape_timeout:  10s
